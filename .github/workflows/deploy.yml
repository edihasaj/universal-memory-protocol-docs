name: Deploy to Cloudflare Pages

# universalmemoryprotocol.io is served by the Cloudflare Pages project
# `universal-memory-protocol`, which is a direct-upload project. Cloudflare
# refuses to attach a Git source to a direct-upload project
# ("You cannot update the `source` object in a Direct Uploads project"), so
# this workflow is how a push becomes a deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ef557fd30cdf86dfadc7331fa29cf064
  PAGES_PROJECT: universal-memory-protocol

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main
